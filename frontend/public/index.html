<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexTutor</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Settings */
            --base-font-size: 16px;

            /* Dark Theme (Default) */
            --primary-color: #00ff88;
            --primary-gradient: linear-gradient(135deg, #00ff88 0%, #00b8ff 100%);
            --secondary-gradient: linear-gradient(135deg, #c09f6f 0%, #ff9700 100%);
            --bg-color: #0a0a0a;
            --bg-gradient: radial-gradient(circle at top right, #1a1a1a 0%, #0a0a0a 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --danger: #ff4646;
            --success: #00ff88;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius: 16px;
            --input-bg: rgba(0, 0, 0, 0.3);
            --modal-bg: #151515;
            --bot-msg-bg: rgba(255, 255, 255, 0.05);
            --user-msg-text: #000;
        }

        /* Light Theme */
        body.light-theme {
            --primary-color: #005A9C; /* Azul Acadêmico/UFPE */
            --primary-gradient: linear-gradient(135deg, #005A9C 0%, #007bb5 100%);
            --secondary-gradient: linear-gradient(135deg, #008040 0%, #4CAF50 100%); /* Verde Ambiental */
            --bg-color: #f0f2f5;
            --bg-gradient: linear-gradient(135deg, #f0f2f5 0%, #e4e9f2 100%);
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 0, 0, 0.08);
            --glass-highlight: rgba(0, 0, 0, 0.05);
            --text-primary: #1a1a1a;
            --text-secondary: #555555;
            --danger: #dc3545;
            --success: #198754;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --input-bg: rgba(255, 255, 255, 0.9);
            --modal-bg: #ffffff;
            --bot-msg-bg: rgba(0, 0, 0, 0.05);
            --user-msg-text: #fff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: var(--base-font-size);
            transition: font-size 0.3s ease;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-color);
            background-image: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            font-size: 1rem;
        }

        /* --- Header --- */
        header {
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background 0.3s;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            text-decoration: none;
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .header-actions {
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }

        .header-actions button {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 0.6rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-family: inherit;
            font-weight: 500;
            min-width: 44px;
            height: 44px;
        }

        .header-actions button:hover {
            background: var(--glass-highlight);
            color: var(--text-primary);
            border-color: var(--primary-color);
        }

        .font-controls {
            display: flex;
            gap: 0.5rem;
            margin-right: 0.5rem;
            padding-right: 0.8rem;
            border-right: 1px solid var(--glass-border);
        }

        /* --- Connection Badge --- */
        .connection-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            background: rgba(128, 128, 128, 0.1);
            border: 1px solid var(--glass-border);
            margin-right: 0.5rem;
            transition: all 0.3s ease;
        }

        .connection-badge .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-secondary);
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        .connection-badge.connected {
            background: rgba(0, 255, 136, 0.1);
            border-color: rgba(0, 255, 136, 0.2);
            color: var(--success);
        }

        .connection-badge.connected .status-dot {
            background-color: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        .connection-badge.disconnected {
            color: var(--text-secondary);
        }

        .connection-badge.loading .status-dot {
            background-color: #ffd700;
            animation: pulse 1s infinite;
        }

        /* --- Main Layout --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem;
            height: calc(100vh - 80px); /* Adjust based on header height */
        }

        /* --- Chat Interface --- */
        .chat-interface {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            position: relative;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            gap: 1rem;
            max-width: 80%;
            animation: fadeIn 0.4s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.bot {
            align-self: flex-start;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: var(--glass-highlight);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
        }

        .message.user .avatar {
            background: var(--primary-gradient);
            color: #fff;
        }

        .message.bot .avatar {
            background: rgba(128, 128, 128, 0.1);
        }

        .message-content {
            padding: 1.25rem;
            border-radius: 18px;
            line-height: 1.6;
            font-size: 1rem;
            position: relative;
            word-wrap: break-word;
        }

        .message.bot .message-content {
            background: var(--bot-msg-bg);
            border: 1px solid var(--glass-border);
            border-top-left-radius: 4px;
            color: var(--text-primary);
        }

        .message.user .message-content {
            background: var(--primary-gradient);
            color: var(--user-msg-text);
            font-weight: 500;
            border-top-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* --- Code Blocks in Messages --- */
        .bot-response pre {
            background: rgba(0, 0, 0, 0.5);
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 0.5rem 0;
        }
        
        .bot-response code {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            color: #fff;
        }
        
        .bot-response pre code {
            background: transparent;
            padding: 0;
        }

        .bot-response ul, .bot-response ol {
            padding-left: 1.5rem;
            margin: 0.5rem 0;
        }
        
        .bot-response li {
            margin-bottom: 0.25rem;
        }

        /* --- Chat Input --- */
        .chat-input-area {
            padding: 1.5rem;
            background: var(--glass-highlight);
            border-top: 1px solid var(--glass-border);
        }

        .input-group {
            display: flex;
            gap: 1rem;
            position: relative;
        }

        .input-group input {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            padding: 1.2rem 1.5rem;
            border-radius: 50px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(0, 90, 156, 0.1);
            background: var(--input-bg);
        }

        .input-group button {
            background: var(--primary-gradient);
            border: none;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--user-msg-text);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .input-group button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 90, 156, 0.4);
        }
        
        .input-group button:active {
            transform: scale(0.95);
        }

        .input-group button:disabled {
            background: var(--text-secondary);
            cursor: not-allowed;
            transform: none;
        }

        /* --- Settings Modal --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--modal-bg);
            width: 95%;
            max-width: 700px;
            border-radius: var(--radius);
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform: translateY(20px);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-highlight);
        }

        .modal-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .close-modal {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-modal:hover {
            color: var(--danger);
        }

        .modal-body {
            padding: 1.5rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .form-control {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            padding: 0.8rem;
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .btn {
            width: 100%;
            padding: 0.9rem;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: var(--user-msg-text);
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        .status-container {
            margin-top: 1rem;
            padding: 0.8rem;
            background: var(--glass-highlight);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-secondary);
            transition: all 0.3s;
        }

        .status-connected { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .status-error { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
        .status-loading { background: #ffd700; animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* --- Loaders --- */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            width: fit-content;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,0.1);
            border-radius: 50%;
            border-top-color: #000;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* --- Preference Controls --- */
        .radio-group {
            display: flex;
            background: rgba(128, 128, 128, 0.1);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 4px;
            gap: 4px;
        }

        .radio-option {
            flex: 1;
            position: relative;
        }

        .radio-option input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .radio-option label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            width: 100%;
            height: 100%;
            margin: 0;
        }

        .radio-option input:checked + label {
            background: var(--primary-gradient);
            color: var(--user-msg-text);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .radio-option label:hover {
            color: var(--text-primary);
            background: rgba(255,255,255,0.05);
        }

        .radio-option input:checked + label:hover {
            opacity: 0.9;
        }
        
        .radio-option label i {
            margin-right: 6px;
        }

        /* --- Footer --- */
        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--glass-border);
            margin-top: auto;
        }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            main {
                padding: 1rem;
                height: calc(100vh - 70px);
            }

            .chat-messages {
                padding: 1rem;
            }

            .modal-content {
                width: 95%;
                margin: 0 auto;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .header-actions .status-label {
                display: none;
            }
            
            .font-controls {
                padding-right: 0.5rem;
            }
            
            .font-controls button {
                padding: 0.4rem;
                min-width: 36px;
                height: 36px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">
            <h1>FlexTutor</h1>
        </a>
        <div class="header-actions">
            <!-- Connection Status Indicator -->
            <div id="header-connection-status" class="connection-badge disconnected" title="Banco de Dados: Desconectado">
                <span class="status-dot"></span>
                <span class="status-label d-none d-md-inline">Desconectado</span>
            </div>

            <button onclick="togglePreferences()" title="Preferências">
                <i class="fa-solid fa-gear"></i>
                <span class="d-none d-md-inline">Preferências</span>
            </button>
            <button onclick="toggleSettings()">
                <i class="fa-solid fa-database"></i>
                <span class="d-none d-md-inline">Configurar</span>
            </button>
        </div>
    </header>

    <main>
        <section class="chat-interface">
            <div class="chat-messages" id="chatbot-messages">
                <!-- Welcome Message -->
                <div class="message bot">
                    <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="message-content">
                        Olá! Sou o FlexTutor. Como posso ajudar você hoje?
                    </div>
                </div>
            </div>
            
            <div class="chat-input-area">
                <div class="input-group">
                    <input type="text" id="chatbot-input" placeholder="Pergunte sobre FlexSim, modelos ou dados..." autocomplete="off">
                    <button onclick="sendMessage()" id="send-btn" aria-label="Enviar mensagem">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 FlexTutor. Criado por Leandro Silva (<a href="mailto:leandro.hgsilva@ufpe.br" style="color: var(--primary-color); text-decoration: none;">leandro.hgsilva@ufpe.br</a>).</p>
    </footer>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Configuração do Banco de Dados</h2>
                <button class="close-modal" onclick="toggleSettings()"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="dbUser">Usuário</label>
                        <input type="text" id="dbUser" class="form-control" placeholder="ex: postgres">
                    </div>
                    <div class="form-group">
                        <label for="dbHost">Host</label>
                        <input type="text" id="dbHost" class="form-control" placeholder="ex: localhost">
                    </div>
                    <div class="form-group">
                        <label for="dbDatabase">Database</label>
                        <input type="text" id="dbDatabase" class="form-control" placeholder="Nome do banco">
                    </div>
                    <div class="form-group">
                        <label for="dbPassword">Senha</label>
                        <input type="password" id="dbPassword" class="form-control" placeholder="••••••">
                    </div>
                    <div class="form-group">
                        <label for="dbPort">Porta</label>
                        <input type="text" inputmode="numeric" pattern="[0-9]*" id="dbPort" class="form-control" placeholder="5432" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                    </div>
                    <div class="form-group full-width">
                        <label for="dbTables">Tabelas (separadas por vírgula)</label>
                        <input type="text" id="dbTables" class="form-control" placeholder="ex: tabela1, tabela2">
                    </div>
                </div>

                <button class="btn btn-primary" onclick="testConnection()" id="test-btn">
                    <i class="fa-solid fa-plug"></i> Testar Conexão
                </button>
            </div>
        </div>
    </div>

    <!-- Preferences Modal -->
    <div class="modal-overlay" id="preferences-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Preferências do Usuário</h2>
                <button class="close-modal" onclick="togglePreferences()"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Tema</label>
                    <div class="radio-group theme-selector">
                        <div class="radio-option">
                            <input type="radio" name="theme" id="theme-dark" value="dark" onchange="setTheme('dark')">
                            <label for="theme-dark"><i class="fa-solid fa-moon"></i> Escuro</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" name="theme" id="theme-light" value="light" onchange="setTheme('light')">
                            <label for="theme-light"><i class="fa-solid fa-sun"></i> Claro</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Tamanho da Fonte</label>
                    <div class="radio-group font-selector">
                        <div class="radio-option">
                            <input type="radio" name="fontsize" id="font-small" value="14" onchange="setFontSize(14)">
                            <label for="font-small">Pequeno</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" name="fontsize" id="font-medium" value="16" onchange="setFontSize(16)">
                            <label for="font-medium">Médio</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" name="fontsize" id="font-large" value="18" onchange="setFontSize(18)">
                            <label for="font-large">Grande</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" name="fontsize" id="font-xlarge" value="20" onchange="setFontSize(20)">
                            <label for="font-xlarge">Extra</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Preferences Management ---
        function togglePreferences() {
            const modal = document.getElementById('preferences-modal');
            modal.classList.toggle('active');
        }

        function setTheme(themeName) {
            const body = document.body;
            if (themeName === 'light') {
                body.classList.add('light-theme');
                document.getElementById('theme-light').checked = true;
            } else {
                body.classList.remove('light-theme');
                document.getElementById('theme-dark').checked = true;
            }
            localStorage.setItem('theme', themeName);
        }

        function setFontSize(size) {
            const root = document.documentElement;
            root.style.setProperty('--base-font-size', size + 'px');
            localStorage.setItem('flexTutorFontSize', size);
            
            // Update radio button state
            const radio = document.querySelector(`input[name="fontsize"][value="${size}"]`);
            if (radio) radio.checked = true;
        }

        // Initialize Settings
        (function initSettings() {
            // Theme
            const savedTheme = localStorage.getItem('theme');
            const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
            
            if (savedTheme === 'light' || (!savedTheme && prefersLight)) {
                setTheme('light');
            } else {
                setTheme('dark');
            }

            // Font Size
            let savedFontSize = localStorage.getItem('flexTutorFontSize');
            if (!savedFontSize) savedFontSize = 16; // Default
            setFontSize(savedFontSize);
        })();

        // Close preferences modal when clicking outside
        document.getElementById('preferences-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                togglePreferences();
            }
        });

        // --- UI Interaction ---
        
        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            modal.classList.toggle('active');
        }

        // Close modal when clicking outside
        document.getElementById('settings-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                toggleSettings();
            }
        });

        // Allow sending message with Enter key
        document.getElementById('chatbot-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // --- Core Logic (Preserved & Enhanced) ---

        function updateConnectionBadge(status, text) {
            const badge = document.getElementById('header-connection-status');
            const label = badge.querySelector('.status-label');
            
            badge.className = 'connection-badge'; // reset classes
            label.textContent = text;
            
            if (status === 'connected') {
                badge.classList.add('connected');
                badge.title = "Banco de Dados: Conectado e pronto para uso";
            } else if (status === 'loading') {
                badge.classList.add('loading');
                badge.title = "Verificando conexão...";
            } else {
                badge.classList.add('disconnected');
                badge.title = status === 'error' ? "Erro na conexão" : "Banco de Dados: Desconectado (Modo Básico)";
            }
        }

        async function testConnection() {
            const dbUser = document.getElementById('dbUser').value;
            const dbHost = document.getElementById('dbHost').value;
            const dbDatabase = document.getElementById('dbDatabase').value;
            const dbPassword = document.getElementById('dbPassword').value;
            const dbPort = document.getElementById('dbPort').value;
            
            const testBtn = document.getElementById('test-btn');
            const originalBtnContent = testBtn.innerHTML;

            // UI Loading State
            updateConnectionBadge('loading', 'Verificando...');
            testBtn.disabled = true;
            testBtn.innerHTML = '<div class="spinner"></div> Conectando...';

            try {
                const response = await fetch('https://flexbotserver.onrender.com/api/test-connection', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user: dbUser,
                        host: dbHost,
                        database: dbDatabase,
                        password: dbPassword,
                        port: dbPort,
                    }),
                });

                const data = await response.json();
                
                if (data.success) {
                    updateConnectionBadge('connected', 'Conectado');
                    testBtn.innerHTML = '<i class="fa-solid fa-check"></i> Sucesso!';
                    setTimeout(() => {
                        testBtn.innerHTML = originalBtnContent;
                        testBtn.disabled = false;
                    }, 2000);
                } else {
                    updateConnectionBadge('error', 'Erro');
                    testBtn.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Falha';
                    alert('Falha na conexão: ' + data.message);
                    setTimeout(() => {
                        testBtn.innerHTML = originalBtnContent;
                        testBtn.disabled = false;
                    }, 2000);
                }
            } catch (error) {
                updateConnectionBadge('error', 'Erro');
                testBtn.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Erro';
                alert('Erro de rede: ' + error.message);
                setTimeout(() => {
                    testBtn.innerHTML = originalBtnContent;
                    testBtn.disabled = false;
                }, 2000);
            }
        }

        async function loadDataFromDatabase() {
            const dbUser = document.getElementById('dbUser').value;
            const dbHost = document.getElementById('dbHost').value;
            const dbDatabase = document.getElementById('dbDatabase').value;
            const dbPassword = document.getElementById('dbPassword').value;
            const dbPort = document.getElementById('dbPort').value;
            const dbTables = document.getElementById('dbTables').value;

            // Check for missing info - SILENT FAIL (Allow offline mode)
            if (!dbUser || !dbHost || !dbDatabase || !dbTables) {
                console.log('Modo desconectado: Informações de banco de dados incompletas.');
                updateConnectionBadge('disconnected', 'Desconectado');
                return null;
            }

            try {
                const response = await fetch('https://flexbotserver.onrender.com/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user: dbUser,
                        host: dbHost,
                        database: dbDatabase,
                        password: dbPassword,
                        port: dbPort,
                        tables: dbTables.split(',').map(table => table.trim()),
                    }),
                });

                const data = await response.json();
                if (data.success) {
                    updateConnectionBadge('connected', 'Conectado');
                    return data.data; 
                } else {
                    console.error('Erro ao carregar dados:', data.message);
                    updateConnectionBadge('error', 'Erro na Consulta');
                    return null;
                }
            } catch (error) {
                console.error('Erro na requisição:', error);
                updateConnectionBadge('error', 'Erro de Rede');
                return null;
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chatbot-input');
            const sendBtn = document.getElementById('send-btn');
            const message = input.value.trim();

            if (!message) return;

            // Disable input while processing
            input.disabled = true;
            sendBtn.disabled = true;

            displayMessage(message, 'user');
            input.value = '';

            // Show typing indicator
            const typingId = showTypingIndicator();

            try {
                // Load context data
                const dbData = await loadDataFromDatabase();
                
                // If dbData is null (and it was required/failed), user might want to know, 
                // but the original logic continued. We'll proceed but log it.

                const response = await fetch('https://flexbotserver.onrender.com/api/chatbot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message,
                        dbData,
                    }),
                });

                const data = await response.json();
                
                // Remove typing indicator
                removeTypingIndicator(typingId);

                if (data.success) {
                    displayMessage(data.response, 'bot');
                } else {
                    displayMessage('Desculpe, ocorreu um erro ao processar sua mensagem.', 'bot');
                }
            } catch (error) {
                removeTypingIndicator(typingId);
                displayMessage('Erro ao conectar ao servidor. Verifique sua internet.', 'bot');
                console.error(error);
            } finally {
                // Re-enable input
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
            }
        }

        function displayMessage(message, sender) {
            const messagesDiv = document.getElementById('chatbot-messages');
            const messageElement = document.createElement('div');
            messageElement.className = `message ${sender}`;

            // Avatar
            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'avatar';
            avatarDiv.innerHTML = sender === 'bot' ? '<i class="fa-solid fa-robot"></i>' : '<i class="fa-solid fa-user"></i>';

            // Content
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            if (sender === 'bot') {
                contentDiv.classList.add('bot-response');
                contentDiv.innerHTML = formatResponse(message);
            } else {
                contentDiv.textContent = message;
            }

            // Assemble
            if (sender === 'user') {
                messageElement.appendChild(contentDiv);
                messageElement.appendChild(avatarDiv);
            } else {
                messageElement.appendChild(avatarDiv);
                messageElement.appendChild(contentDiv);
            }

            messagesDiv.appendChild(messageElement);
            
            // Scroll to bottom
            scrollToBottom();
        }

        function scrollToBottom() {
            const messagesDiv = document.getElementById('chatbot-messages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showTypingIndicator() {
            const messagesDiv = document.getElementById('chatbot-messages');
            const id = 'typing-' + Date.now();
            
            const messageElement = document.createElement('div');
            messageElement.className = 'message bot';
            messageElement.id = id;
            
            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'avatar';
            avatarDiv.innerHTML = '<i class="fa-solid fa-robot"></i>';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.style.padding = '0.8rem 1rem';
            
            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator';
            indicator.innerHTML = `
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            `;
            
            contentDiv.appendChild(indicator);
            messageElement.appendChild(avatarDiv);
            messageElement.appendChild(contentDiv);
            
            messagesDiv.appendChild(messageElement);
            scrollToBottom();
            
            return id;
        }

        function removeTypingIndicator(id) {
            const element = document.getElementById(id);
            if (element) {
                element.remove();
            }
        }

        function formatResponse(text) {
            if (!text) return '';
            
            // Protect code blocks from being processed by other regex first
            const codeBlocks = [];
            let processedText = text.replace(/```([\s\S]*?)```/g, (match, code) => {
                codeBlocks.push(code);
                return `__CODE_BLOCK_${codeBlocks.length - 1}__`;
            });

            // Process formatting
            processedText = processedText
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/(•|➔)/g, '•')
                .replace(/(\d+\.\s)/g, '<br><strong>$1</strong>')
                .replace(/`([^`]+)`/g, '<code>$1</code>');

            // Restore code blocks
            processedText = processedText.replace(/__CODE_BLOCK_(\d+)__/g, (match, index) => {
                return `<pre><code>${codeBlocks[index].trim()}</code></pre>`;
            });
            
            // Convert newlines to breaks if not already handled by HTML structure
            return processedText.replace(/\n/g, '<br>');
        }
    </script>
