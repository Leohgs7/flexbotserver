<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexSim AI Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #c09f6f 0%, #ff9700 100%);
            --background-gradient: linear-gradient(45deg, #0a0a0a 0%, #1a1a1a 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--background-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
        }

        .chat-container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .chat-header {
            padding: 1.5rem 2rem;
            background: var(--glass-bg);
            border-bottom: 1px solid var(--glass-border);
            position: relative;
        }

        .chat-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0;
            background: var(--primary-gradient);
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .connection-form {
            padding: 2rem;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--glass-border);
        }

        .connection-form h2 {
            color: var(--text-primary);
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }

        .connection-form input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .connection-form input:focus {
            border-color: #00ff88;
            box-shadow: 0 0 0 3px rgba(0, 255, 135, 0.1);
        }

        .connection-form button {
            background: var(--primary-gradient);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: transform 0.2s ease;
        }

        .connection-form button:hover {
            transform: translateY(-1px);
        }

        .chat-messages {
            height: 60vh;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
        }

        .message {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            animation: messageAppear 0.3s ease-out;
        }

        @keyframes messageAppear {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-content {
            max-width: 70%;
            padding: 1rem 1.25rem;
            border-radius: 15px;
            line-height: 1.5;
            font-size: 0.95rem;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .bot .message-content {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            border-radius: 15px 15px 15px 5px;
        }

        .user .message-content {
            background: var(--primary-gradient);
            color: #000;
            border-radius: 15px 15px 5px 15px;
            font-weight: 500;
        }

        .chat-input {
            padding: 1.5rem 2rem;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid var(--glass-border);
        }

        .input-group {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .input-group input {
            flex: 1;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #00ff88;
            box-shadow: 0 0 0 3px rgba(0, 255, 135, 0.1);
        }

        .input-group button {
            background: var(--primary-gradient);
            border: none;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            color: #000;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .input-group button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0, 255, 135, 0.3);
        }

        #connection-status {
            margin-top: 1rem;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-connected { background: #00ff88; box-shadow: 0 0 8px #00ff8877; }
        .status-error { background: #ff4646; box-shadow: 0 0 8px #ff464677; }

        .bot-response {
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .bot-response code {
            background: rgba(0,0,0,0.3);
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9em;
        }

        .bot-response ul {
            padding-left: 1.5rem;
            margin: 1rem 0;
        }

        .bot-response li {
            margin-bottom: 0.5rem;
            position: relative;
            padding-left: 1rem;
        }

        .bot-response li::before {
            content: '•';
            color: #00ff88;
            position: absolute;
            left: 0;
        }

        @media (max-width: 768px) {
            .chat-container {
                margin: 0;
                border-radius: 0;
            }
            
            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>FlexSim AI Assistant</h1>
        </div>
        <div class="connection-form">
            <h2>Database Configuration</h2>
            <div class="row g-3">
                <div class="col-md-6">
                    <input type="text" id="dbUser" placeholder="Username" class="form-control" />
                </div>
                <div class="col-md-6">
                    <input type="text" id="dbHost" placeholder="Host" class="form-control" />
                </div>
                <div class="col-12">
                    <input type="text" id="dbDatabase" placeholder="Database" class="form-control" />
                </div>
                <div class="col-md-6">
                    <input type="password" id="dbPassword" placeholder="Password" class="form-control" />
                </div>
                <div class="col-md-3">
                    <input type="number" id="dbPort" placeholder="Port" class="form-control" />
                </div>
                <div class="col-md-3">
                    <input type="text" id="dbTables" placeholder="Tables" class="form-control" />
                </div>
            </div>
            <button class="btn btn-primary mt-2" onclick="testConnection()">Test Connection</button>
            <div id="connection-status">
                <div class="status-indicator"></div>
                <span>Not connected</span>
            </div>
        </div>
        <div class="chat-messages" id="chatbot-messages"></div>
        <div class="chat-input">
            <div class="input-group">
                <input type="text" id="chatbot-input" placeholder="Ask me anything about FlexSim..." />
                <button onclick="sendMessage()">Send ➔</button>
            </div>
        </div>
    </div>

    <script>
        async function testConnection() {
            
            const dbUser = document.getElementById('dbUser').value;
            const dbHost = document.getElementById('dbHost').value;
            const dbDatabase = document.getElementById('dbDatabase').value;
            const dbPassword = document.getElementById('dbPassword').value;
            const dbPort = document.getElementById('dbPort').value;
            const connectionStatus = document.getElementById('connection-status');
            const statusElement = document.getElementById('connection-status');
            const statusIndicator = statusElement.querySelector('.status-indicator');
            
            statusIndicator.className = 'status-indicator';
            statusElement.querySelector('span').textContent = 'Testing connection...';

            try {
                const response = await fetch('https://flexbotserver.onrender.com/api/test-connection', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user: dbUser,
                        host: dbHost,
                        database: dbDatabase,
                        password: dbPassword,
                        port: dbPort,
                    }),
                });

                const data = await response.json();
                if (data.success) {
                statusIndicator.classList.add('status-connected');
                statusElement.querySelector('span').textContent = 'Connection successful!';
                } else {
                statusIndicator.classList.add('status-error');
                statusElement.querySelector('span').textContent = 'Connection failed: ' + data.message;
                }
                } catch (error) {
                connectionStatus.textContent = 'Erro ao testar conexão: ' + error.message;
                connectionStatus.style.color = 'red';
                }
        }
        async function loadDataFromDatabase() {
            const dbUser = document.getElementById('dbUser').value;
            const dbHost = document.getElementById('dbHost').value;
            const dbDatabase = document.getElementById('dbDatabase').value;
            const dbPassword = document.getElementById('dbPassword').value;
            const dbPort = document.getElementById('dbPort').value;
            const dbTables = document.getElementById('dbTables').value;
            const connectionStatus = document.getElementById('connection-status');

            if (!dbTables) {
                connectionStatus.textContent = 'Por favor, insira os nomes das tabelas.';
                connectionStatus.style.color = 'red';
                return;
            }

            try {
                const response = await fetch('https://flexbotserver.onrender.com/api/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user: dbUser,
                        host: dbHost,
                        database: dbDatabase,
                        password: dbPassword,
                        port: dbPort,
                        tables: dbTables.split(',').map(table => table.trim()), // Envia a lista de tabelas
                    }),
                });

                const data = await response.json();
        if (data.success) {
            connectionStatus.textContent = 'Dados carregados com sucesso!';
            connectionStatus.style.color = 'green';
            return data.data; 
        } else {
            connectionStatus.textContent = 'Erro ao carregar dados: ' + data.message;
            connectionStatus.style.color = 'red';
            return null;
        }
    } catch (error) {
        connectionStatus.textContent = 'Erro ao carregar dados: ' + error.message;
        connectionStatus.style.color = 'red';
        return null;
    }
}

    async function sendMessage() {
        const input = document.getElementById('chatbot-input');
        const message = input.value.trim();

        if (!message) return;

        displayMessage(message, 'user');
        input.value = '';

        const dbData = await loadDataFromDatabase();
        //const FlexDocData = await loadDataFromKnowledge();
        //const Flexsim_Commands = await loadDataFromCommands();

        if (dbData) {
            try {
                const response = await fetch('https://flexbotserver.onrender.com/api/chatbot', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message,
                        dbData,
                        //FlexDocData,
                        //Flexsim_Commands,
                    }),
                });

                const data = await response.json();
                if (data.success) {
                    displayMessage(data.response, 'bot');
                } else {
                    displayMessage('Erro ao processar a mensagem.', 'bot');
                }
            } catch (error) {
                displayMessage('Erro ao conectar ao backend.', 'bot');
            }
        } else {
            displayMessage('Erro ao carregar dados.', 'bot');
        }
    }

        function displayMessage(message, sender) {
            const messagesDiv = document.getElementById('chatbot-messages');
            const messageElement = document.createElement('div');
            messageElement.className = `message ${sender}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            if (sender === 'bot') {
                contentDiv.classList.add('bot-response');
                contentDiv.innerHTML = formatResponse(message);
            } else {
                contentDiv.textContent = message;
            }

            messageElement.appendChild(contentDiv);
            messagesDiv.appendChild(messageElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function formatResponse(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/(•|➔)/g, '•')
                .replace(/(\d+\.\s)/g, '<br>$1')
                .replace(/`(.*?)`/g, '<code>$1</code>');
        }
    </script>
